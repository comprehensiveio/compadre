name: Monitor hosted Compadre

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-hosted-compadre
  cancel-in-progress: true

defaults:
  run:
    working-directory: hosted/compadre

jobs:
  probe:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Check the web application and controller
        run: node scripts/monitor-hosted-stack.mjs
