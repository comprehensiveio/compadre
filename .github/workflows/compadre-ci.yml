name: Compadre CI

on:
  pull_request:
    paths:
      - hosted/compadre/**
      - .github/workflows/compadre-ci.yml
  push:
    branches: [main]
    paths:
      - hosted/compadre/**
      - .github/workflows/compadre-ci.yml

permissions:
  contents: read

concurrency:
  group: compadre-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: hosted/compadre

jobs:
  test:
    name: Compadre Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compadre
          POSTGRES_USER: compadre
          POSTGRES_PASSWORD: compadre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compadre -d compadre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COMPADRE_TEST_DATABASE_URL: postgresql://compadre:compadre@127.0.0.1:5432/compadre
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # .repos/ holds vendored references with bare gitlinks that plain
          # checkout cannot resolve; the root CI excludes it the same way.
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosted/compadre/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:persistence
      - run: npm run db:check
