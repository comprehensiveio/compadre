# Local Temporal server for Compadre's durable native-T3 run orchestration.
# Ports are offset from the defaults so this stack can run alongside the comp
# repo's local Temporal (7233/8080) and toltagent's (7244/8244).
#
#   docker compose up -d        # gRPC localhost:7243, UI http://localhost:8243
#
# The deployed equivalent is the compadre-temporal service in render.yaml.
services:
  temporal-db:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.4
    ports:
      - "7243:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
    depends_on:
      - temporal-db

  temporal-ui:
    image: temporalio/ui:2.48.3
    ports:
      - "8243:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  temporal_postgres_data:
