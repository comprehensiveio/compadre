services:
  - type: web
    name: compadre-relay
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: COMPADRE_DURABILITY_BACKEND
        value: postgres
      - key: COMPADRE_DURABILITY_DATABASE_URL
        sync: false
    previews:
      generation: off
