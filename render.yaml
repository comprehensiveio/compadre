services:
  - type: web
    name: compadre-relay
    runtime: node
    region: oregon
    plan: standard
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: COMPADRE_PROCESS_ROLE
        value: relay
      - key: COMPADRE_DURABILITY_BACKEND
        value: postgres
      - key: COMPADRE_DURABILITY_DATABASE_URL
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: GITHUB_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: COMPADRE_PUBLIC_URL
        sync: false
    previews:
      generation: off
